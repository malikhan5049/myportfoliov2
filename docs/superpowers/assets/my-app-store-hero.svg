<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="My App Store illustration">
  <defs>
    <linearGradient id="mas-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="24" fill="url(#mas-bg)"/>

  <!-- subtle dot grid -->
  <g fill="#8b7fe0" opacity="0.5">
    <circle cx="64" cy="72" r="3"/><circle cx="112" cy="72" r="3"/><circle cx="160" cy="72" r="3"/>
    <circle cx="64" cy="120" r="3"/><circle cx="112" cy="120" r="3"/><circle cx="160" cy="120" r="3"/>
    <circle cx="64" cy="168" r="3"/><circle cx="112" cy="168" r="3"/><circle cx="160" cy="168" r="3"/>
    <circle cx="480" cy="312" r="3"/><circle cx="528" cy="312" r="3"/><circle cx="576" cy="312" r="3"/>
    <circle cx="480" cy="360" r="3"/><circle cx="528" cy="360" r="3"/><circle cx="576" cy="360" r="3"/>
    <circle cx="480" cy="408" r="3"/><circle cx="528" cy="408" r="3"/><circle cx="576" cy="408" r="3"/>
  </g>

  <!-- back card (translucent, offset down-right) -->
  <rect x="252" y="140" width="220" height="270" rx="22" fill="#f8fafc" opacity="0.25"/>

  <!-- front profile card -->
  <rect x="172" y="96" width="220" height="270" rx="22" fill="#f8fafc"/>
  <!-- avatar -->
  <circle cx="212" cy="142" r="34" fill="url(#mas-bg)"/>
  <circle cx="212" cy="132" r="11" fill="#f8fafc" opacity="0.9"/>
  <path d="M192 160 a20 12 0 0 1 40 0 z" fill="#f8fafc" opacity="0.9"/>
  <!-- text lines -->
  <rect x="196" y="196" width="172" height="16" rx="8" fill="#8b5cf6"/>
  <rect x="196" y="230" width="136" height="13" rx="6.5" fill="#a78bfa"/>
  <rect x="196" y="260" width="154" height="13" rx="6.5" fill="#a78bfa"/>
  <rect x="196" y="290" width="112" height="13" rx="6.5" fill="#a78bfa"/>
  <!-- card action pill -->
  <rect x="196" y="322" width="86" height="26" rx="13" fill="#8b5cf6" opacity="0.85"/>
  <path d="M212 335 h10 m-4 -4 l4 4 l-4 4" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating project tiles -->
  <g stroke="#e8edf7" stroke-width="5" fill="#ffffff" opacity="0.14">
    <rect x="470" y="130" width="92" height="92" rx="18"/>
    <rect x="470" y="246" width="92" height="92" rx="18"/>
  </g>
  <g stroke="#e8edf7" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M486 206 l20 -22 14 14 20 -18"/>
    <circle cx="516" cy="288" r="10"/>
    <path d="M502 312 h28"/>
  </g>

  <!-- ground line -->
  <path d="M140 408 h360" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>